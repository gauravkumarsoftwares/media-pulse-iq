spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-staging:9092}
    properties:
      # Broker client auth (OWASP A02); credentials via app-secrets env.
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}

platform:
  pinot:
    enabled: true
    broker: ${PINOT_BROKER:pinot-staging:8099}
    scheme: ${PINOT_SCHEME:http}               # http in staging; flip to https when TLS is added
    auth-scheme: ${PINOT_AUTH_SCHEME:BASIC}    # Basic auth enabled in staging
    username: ${PINOT_USERNAME:}               # from app-secrets K8s Secret
    password: ${PINOT_PASSWORD:}               # from app-secrets K8s Secret
    auth-token: ${PINOT_AUTH_TOKEN:}           # alternative: set if using TOKEN scheme
  trino:
    enabled: true
    jdbc-url: ${TRINO_JDBC_URL:jdbc:trino://trino-staging:8080/iceberg/ads}
    user: ${TRINO_USER:insights-query-service}  # from app-secrets K8s Secret
    password: ${TRINO_PASSWORD:}
    query-timeout-seconds: 60
    max-pool-size: 5                            # smaller pool in staging
    min-idle: 1
    ssl-enabled: ${TRINO_SSL_ENABLED:false}
  security:
    # Option C (token-exchange): verify the gateway-minted internal v4.local token.
    paseto:
      enabled: true
      mode: local
      local-key: ${PASETO_LOCAL_KEY:}
      issuer: ${PASETO_ISSUER:edge}
      audience: ${PASETO_AUDIENCE:event-analysis}
      token-header: ${PASETO_TOKEN_HEADER:X-Internal-Token}
      clock-skew-seconds: 30

logging:
  level:
    root: INFO
    com.java: INFO

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
