spring:
  application:
    name: insights-query-service
  profiles:
    default: local
  kafka:
    consumer:
      group-id: "${platform.kafka.consumer-group.insights-serving}"
      # ---- Zero-loss: manual offset commit --------------------------------
      enable-auto-commit: false
      properties:
        fetch.min.bytes: 1048576
        fetch.max.wait.ms: 500
        max.poll.interval.ms: 300000
        heartbeat.interval.ms: 15000
        session.timeout.ms: 45000
      max-poll-records: 500
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

server:
  port: 8083
  # ---- Tomcat access log (architecture 8 — observability) ----
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      prefix: access_log
      suffix: .log
      rotate: true
      rename-on-rotate: true
      max-days: 30
      pattern: '%h %l %u %t "%r" %s %b %D ms tenant="%{X-Tenant-Context}i" reqId="%{X-Request-Id}i"'
      buffered: false

platform:
  kafka:
    env: ${KAFKA_ENV:local}
    topic:
      enriched: "${platform.kafka.env}.internal.event.ads.attribution.ad-interaction-enriched-by-campaign"
    consumer-group:
      stream-engine: "${platform.kafka.env}.ads.stream-processing-engine"
      insights-serving: "${platform.kafka.env}.ads.insights-query-service"
  query:
    max-buckets: 10000        # BUCKET-CAP: max grain-aligned buckets per time-series response
    routing:
      hot-window-hours: 48   # OCP: tier boundary — queries within 48 h → Redis
      warm-window-days: 30   # OCP: tier boundary — queries within 30 d → Pinot
  pinot:
    broker: ${PINOT_BROKER:localhost:8099}
    scheme: ${PINOT_SCHEME:http}          # http (default) or https
    table: shopping_events
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    enabled: false
    # ---- Broker authentication ----
    # auth-scheme: NONE | BASIC | TOKEN  (default NONE — no Authorization header)
    # BASIC  →  username + password injected via PINOT_USERNAME / PINOT_PASSWORD K8s Secrets
    # TOKEN  →  auth-token injected via PINOT_AUTH_TOKEN K8s Secret
    auth-scheme: ${PINOT_AUTH_SCHEME:NONE}
    username: ${PINOT_USERNAME:}
    password: ${PINOT_PASSWORD:}
    auth-token: ${PINOT_AUTH_TOKEN:}

  # ---- Trino / Iceberg cold-tier (query window > 30 days, architecture 4.3) ----
  trino:
    enabled: false                        # set true in staging/prod; false keeps StarTree fallback
    # Full JDBC URL — must include catalog and schema for HikariCP to work without USE statements.
    jdbc-url: ${TRINO_JDBC_URL:jdbc:trino://trino:8080/iceberg/ads}
    user: ${TRINO_USER:insights-query-service}   # Trino X-Trino-User header; from K8s Secret
    password: ${TRINO_PASSWORD:}                 # LDAP / file auth; leave blank if not needed
    catalog: iceberg
    schema: ads
    table: shopping_events
    query-timeout-seconds: 60            # per-statement timeout; guards against runaway scans
    # HikariCP pool — small by design (cold queries are rare and internally parallel in Trino)
    max-pool-size: 10
    min-idle: 2
    connection-timeout-ms: 30000
    idle-timeout-ms: 600000
    keepalive-time-ms: 300000
    # TLS — enable for Trino clusters with HTTPS termination (staging/prod)
    ssl-enabled: ${TRINO_SSL_ENABLED:false}
    ssl-truststore-path: ${TRINO_SSL_TRUSTSTORE_PATH:}
    ssl-truststore-password: ${TRINO_SSL_TRUSTSTORE_PASSWORD:}

  # ---- Periodic reconciliation (architecture 9.1) ----
  reconciliation:
    enabled: true
    # Percentage drift allowed before flagging a discrepancy (e.g. 1.0 = 1 %)
    discrepancy-threshold-pct: 1.0
    # Upper bound on campaign keys processed per run (guards against huge result sets)
    max-campaigns-per-run: 5000
    # Cron: hourly hot-tier job (Redis vs Pinot) — 5 minutes past every hour
    hourly-cron: "0 5 * * * *"
    # Cron: daily warm-tier job (Pinot vs Iceberg) — 01:15 UTC every day
    daily-cron: "0 15 1 * * *"
    # Auto-correct Redis deficits detected by the hourly job
    auto-correct-redis: true

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # ---- OB-1: Distributed Tracing ----
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

# ---- Logging (access logs + service layer) ----
logging:
  level:
    # API access log: logs every inbound request before and after dispatch
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG
    # Service / business logic layers
    com.java.query: DEBUG
    # Reduce framework noise in production — override per-environment as needed
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
