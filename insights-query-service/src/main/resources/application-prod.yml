spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-prod-msk:9094}
    consumer:
      enable-auto-commit: false
      max-poll-records: 500
      properties:
        fetch.min.bytes: 1048576
        fetch.max.wait.ms: 500
        max.poll.interval.ms: 300000
        heartbeat.interval.ms: 15000
        session.timeout.ms: 45000
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:64}   # match prod partition count
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}

platform:
  kafka:
    env: prod    # → topics become prod.internal.event.ads.attribution.… etc.
  pinot:
    enabled: true
    broker: ${PINOT_BROKER:pinot-prod:8099}
    scheme: ${PINOT_SCHEME:https}              # TLS-terminated in prod
    auth-scheme: ${PINOT_AUTH_SCHEME:BASIC}    # Basic auth enabled in prod
    username: ${PINOT_USERNAME:}               # from app-secrets K8s Secret
    password: ${PINOT_PASSWORD:}               # from app-secrets K8s Secret
    auth-token: ${PINOT_AUTH_TOKEN:}           # alternative: set if using TOKEN scheme
  trino:
    enabled: true
    jdbc-url: ${TRINO_JDBC_URL:jdbc:trino://trino-prod:8080/iceberg/ads}
    user: ${TRINO_USER:insights-query-service}  # from app-secrets K8s Secret
    password: ${TRINO_PASSWORD:}                # LDAP password; from app-secrets K8s Secret
    query-timeout-seconds: 60
    max-pool-size: 10
    min-idle: 2
    ssl-enabled: ${TRINO_SSL_ENABLED:true}
    ssl-truststore-path: ${TRINO_SSL_TRUSTSTORE_PATH:}
    ssl-truststore-password: ${TRINO_SSL_TRUSTSTORE_PASSWORD:}
  security:
    paseto:
      enabled: true
      mode: local
      local-key: ${PASETO_LOCAL_KEY:}
      issuer: ${PASETO_ISSUER:edge}
      audience: ${PASETO_AUDIENCE:media-pulse-iq}
      token-header: ${PASETO_TOKEN_HEADER:X-Internal-Token}
      clock-skew-seconds: 30

logging:
  level:
    root: WARN
    com.java: INFO

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  # ---- OB-1: Distributed Tracing (prod) ----
  tracing:
    sampling:
      probability: 0.1
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}
