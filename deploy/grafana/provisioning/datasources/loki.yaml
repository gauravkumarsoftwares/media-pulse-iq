# =============================================================
# Grafana datasource — Grafana Loki (OB-5)
# Provisioned automatically when Grafana starts.
# Loki is used for correlated log queries on top of Prometheus
# metrics (e.g. "show logs for this time range with requestId X").
# =============================================================
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: false
    jsonData:
      # Correlate Loki logs with Prometheus metrics via the service label
      derivedFields:
        - name: requestId
          matcherRegex: '"requestId":"([^"]+)"'
          url: '$${__value.raw}'
          datasourceUid: ''
        - name: TraceID
          matcherRegex: '"traceId":"([^"]+)"'
          # Link trace IDs directly to Jaeger
          url: 'http://localhost:16686/trace/$${__value.raw}'

