# =============================================================
# Fluent Bit configuration — Ad Analytics Platform (OB-5)
# Docker Compose mode: tails Docker container logs from the
# host path /var/lib/docker/containers and ships them to Loki.
#
# For Kubernetes, use deploy/k8s/base/fluent-bit-daemonset.yaml
# which reads from /var/log/containers/*.log and adds k8s labels.
# =============================================================

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     warn

# ---- Input: Docker container logs ------------------------------------
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.<container_id>
    Tag_Regex         (?<container_id>[a-z0-9]{64})
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

# ---- Parser: Docker JSON log format ----------------------------------
[PARSER]
    Name   docker
    Format json
    Time_Key time
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep On

# ---- Parser: Production Logstash JSON (nested "log" key) ------------
[PARSER]
    Name   logstash_json
    Format json

# ---- Filter: Lift nested Logstash JSON fields -----------------------
# When Spring Boot prod profile emits JSON via LogstashEncoder,
# the Docker log wrapper has: {"log": "{\"message\":\"...\",\"requestId\":\"...\"}", ...}
# This filter JSON-parses the inner "log" field to surface requestId, tenantId, etc.
[FILTER]
    Name   parser
    Match  docker.*
    Key_Name log
    Parser logstash_json
    Preserve_Key On
    Reserve_Data On

# ---- Output: Grafana Loki --------------------------------------------
[OUTPUT]
    Name            loki
    Match           docker.*
    Host            loki
    Port            3100
    Labels          job=fluent-bit, env=local
    # Use service label from JSON if present, otherwise fall back to container name
    Label_Keys      $service
    Auto_Kubernetes_Labels Off
    # Loki requires sorted labels — enable line format for text logs
    Line_Format     json

