# =====================================================================
# DEV overlay - patches base for the dev namespace.
# Generates 'app-config' ConfigMap from configmap.env and injects it
# into all service deployments via env. Keeps 2 replicas for cost.
# =====================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base

configMapGenerator:
  - name: app-config
    envs:
      - configmap.env

replicas:
  - name: ingestion-service
    count: 2
  - name: stream-processing-engine
    count: 2
  - name: insights-query-service
    count: 2

