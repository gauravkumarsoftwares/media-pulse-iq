# =============================================================
# Fluent Bit DaemonSet — Ad Analytics Platform (OB-5)
# Collects structured JSON logs from all pods and ships them to
# Grafana Loki for centralised log aggregation and querying.
#
# Prerequisites:
#   - Loki deployed in the cluster (e.g. via grafana/loki Helm chart)
#   - Pods emit JSON logs (prod Spring profile uses LogstashEncoder)
#
# Labels extracted from JSON: service, env, requestId, tenantId, traceId
# =============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: ad-analytics-prod
  labels:
    app: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     warn
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/ingestion-service*.log,/var/log/containers/stream-processing-engine*.log,/var/log/containers/insights-query-service*.log
        Parser            cri
        Tag               k8s.<namespace_name>.<pod_name>.<container_name>
        Tag_Regex         (?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-
        Refresh_Interval  5
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        DB                /var/log/flb_ad_analytics.db

    [PARSER]
        Name   cri
        Format regex
        Regex  ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name   logstash_json
        Format json

    # Lift Logstash JSON fields (requestId, tenantId, traceId, service, etc.)
    [FILTER]
        Name   parser
        Match  k8s.*
        Key_Name log
        Parser logstash_json
        Preserve_Key Off
        Reserve_Data On

    # Add kubernetes labels as Loki labels
    [FILTER]
        Name   kubernetes
        Match  k8s.*
        Kube_URL          https://kubernetes.default.svc:443
        Kube_CA_File      /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File   /var/run/secrets/kubernetes.io/serviceaccount/token
        Labels            On
        Annotations       Off
        Merge_Log         On
        K8S-Logging.Parser On

    [OUTPUT]
        Name            loki
        Match           k8s.*
        Host            loki.monitoring.svc.cluster.local
        Port            3100
        Labels          job=fluent-bit, env=prod
        # Surface extracted JSON fields as Loki labels for fast filtering
        Label_Keys      $service, $tenantId
        Auto_Kubernetes_Labels On
        Line_Format     json

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: ad-analytics-prod
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "2020"
        prometheus.io/path:   "/api/v1/metrics/prometheus"
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.1
          ports:
            - containerPort: 2020
              name: http-metrics
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
          resources:
            requests:
              cpu:    100m
              memory: 64Mi
            limits:
              cpu:    200m
              memory: 128Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit-config

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: ad-analytics-prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-role
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-role
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: ad-analytics-prod

