# =====================================================================
# Base manifest: insights-query-service (Read Path / CQRS)
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insights-query-service
  labels: { app: insights-query-service }
spec:
  replicas: 1
  selector:
    matchLabels: { app: insights-query-service }
  template:
    metadata:
      labels: { app: insights-query-service }
    spec:
      containers:
        - name: insights-query-service
          image: registry.io/media-pulse-iq/insights-query-service:latest
          ports:
            - { containerPort: 8083 }   # app
            - { containerPort: 9090 }   # management/actuator (not exposed by Service)
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }   # required: PASETO key + credentials (fail-closed)
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 9090 }
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 9090 }
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: insights-query-service
spec:
  selector: { app: insights-query-service }
  ports:
    - port: 80
      targetPort: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insights-query-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insights-query-service
  minReplicas: 1
  maxReplicas: 50
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

