spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-prod-msk:9094}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}

platform:
  kafka:
    env: prod    # → topics become prod.shared.event.ads.clickstream.… etc.
  flink:
    enabled: true
    parallelism: 64     # match prod Kafka partition count
    use-rocks-db: true
    checkpoint-interval-ms: 30000
    checkpoint-dir: ${FLINK_CHECKPOINT_DIR:s3://media-pulse-iq-prod/flink-checkpoints}

logging:
  level:
    root: WARN
    com.java: INFO

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
